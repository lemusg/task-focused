<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Website Blocked</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f5f7fb;
        color: #1f2937;
      }

      .card {
        width: min(640px, calc(100vw - 32px));
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
        padding: 28px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.9rem;
      }

      p {
        line-height: 1.55;
        margin: 0 0 12px;
      }

      .url {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        background: #eef2ff;
        color: #3730a3;
        padding: 12px 14px;
        border-radius: 12px;
        word-break: break-all;
        margin: 14px 0 18px;
      }

      .meta {
        color: #6b7280;
        font-size: 0.95rem;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #0f172a;
          color: #e5e7eb;
        }

        .card {
          background: #111827;
          box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .url {
          background: #1f2937;
          color: #c7d2fe;
        }

        .meta {
          color: #9ca3af;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Website blocked</h1>
      <p>This website is on your block list, so access has been prevented.</p>
      <div class="url" id="blocked-url">Loading…</div>
      <p class="meta" id="blocked-meta"></p>
    </main>

    <script src="blocked.js"></script>
  </body>
</html>
